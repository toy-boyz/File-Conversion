app:
  datasource:
    primary:
      url: jdbc:mysql://localhost:3306/api?serverTimezone=Asia/Seoul
      username: root
      password:
      driver-class-name: com.mysql.cj.jdbc.Driver

    secondary:
      url: jdbc:mysql://localhost:3306/worker?serverTimezone=Asia/Seoul
      username: root
      password:
      driver-class-name: com.mysql.cj.jdbc.Driver

  s3:
    bucket: toyboyz-fileconv-bucket
    region: ap-northeast-2
    prefix: uploads
    presign-ttl-seconds: 900   # 15분

spring:
  open-in-view: true
  hibernate:
    ddl-auto: update
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    use-new-id-generator-mappings: false
  show-sql: true
  properties:
    hibernate.format_sql: true
    dialect: org.hibernate.dialect.MySQL8InnoDBDialect

#  rabbitmq:
#    host: ${SPRING_RABBITMQ_HOST:localhost}
#    port: ${SPRING_RABBITMQ_PORT:5672}
#    username: ${SPRING_RABBITMQ_USERNAME:toyboyz}
#    password: ${SPRING_RABBITMQ_PASSWORD:toyboyz}
#    virtual-host: ${SPRING_RABBITMQ_VHOST:/}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    rabbit:
      enabled: true

